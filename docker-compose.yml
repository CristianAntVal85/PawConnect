services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawconnect-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_KEY=base64:xzb03FtHK3NDdLuRli/M4DQ7y9y58PU4+5vY9aQ/Kd4=
    depends_on:
      - mysql
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.0
    container_name: pawconnect-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pawconnect
      MYSQL_USER: pawconnect
      MYSQL_PASSWORD: pawconnect
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
