services:
  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: pawconnect-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:xzb03FtHK3NDdLuRli/M4DQ7y9y58PU4+5vY9aQ/Kd4=
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=pawconnect
      - DB_USERNAME=pawconnect
      - DB_PASSWORD=pawconnect
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: pawconnect-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pawconnect
      MYSQL_USER: pawconnect
      MYSQL_PASSWORD: pawconnect
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
